server.port=8081

# ===================== 数据源（MySQL） =====================
# 注：password 为占位符，待填入本地 MySQL 密码后生效
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/idv_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===================== MyBatis-Plus =====================
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=
# 开启 SQL 日志，便于调试（生产可去掉）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        body { font-family: "Microsoft YaHei", Arial, sans-serif; margin: 60px; color: #222; }
        .box { max-width: 420px; padding: 28px 32px; border: 1px solid #e3e3e3; border-radius: 10px; }
        h2 { margin-top: 0; }
        label { display: inline-block; width: 72px; }
        input { padding: 6px 8px; width: 200px; }
        button { padding: 6px 18px; }
        .err { color: #c0392b; font-size: 14px; }
        .tip { color: #888; font-size: 13px; margin-top: 16px; }
    </style>
</head>
<body>
<div class="box">
    <h2>用户登录</h2>
    <p class="err" th:if="${msg}" th:text="${msg}">密码错误</p>
    <form action="login" method="post">
        <div>
            <label for="username">用户名:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div style="margin-top:10px;">
            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div style="margin-top:16px;">
            <button type="submit">登录</button>
        </div>
    </form>
    <p class="tip">演示账号：任意用户名，密码固定为 123（见 UserController#login）</p>
</div>
</body>
</html>

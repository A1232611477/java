spring.application.name=springBootTest
# 默认启用的环境配置，对应 application-dev.properties
spring.profiles.active=dev
# 全局日志级别
logging.level.root=info
# 业务包日志级别（注意：包名少写了 test，正确应为 com.fenglin.springboottest，否则本行不生效）
logging.level.com.fengling.springboot=warn
# 日志输出到文件
logging.file.name=log/xx.log
# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
# 文件日志格式（原写法误写成 logging.pattern.file=logging.pattern.console=... 已修正）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
# ===== JWT login token =====
# HMAC-SHA256 secret, MUST be >= 32 bytes. Change it in production.
jwt.secret=idv-auth-springboottest-secret-key-please-change-me-2026
# Token validity in minutes.
jwt.expire-minutes=120
# Header name and prefix used to carry the token.
jwt.header=Authorization
jwt.prefix=Bearer 
# 勾选「记住我」时签发的长效令牌有效期（分钟），10080 = 7 天
jwt.remember-expire-minutes=10080

# ===== 服务器端页面流程的会话（Session）=====
# 只用 Cookie 传递会话，关掉容器默认的 URL 重写，
# 否则客户端不带 Cookie 时重定向地址里会出现难看的 ;jsessionid=xxxx
server.servlet.session.tracking-modes=cookie
# 会话空闲超时
server.servlet.session.timeout=30m
